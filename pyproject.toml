[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarx-home"
version = "3.1.3"
description = "Private, lightweight home-server portal with files, photos, Linux desktop and managed applications."
requires-python = ">=3.12"
dependencies = ["cryptography>=43,<47", "Pillow>=10.4,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["static/vendor"]
